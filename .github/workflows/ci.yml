name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — lint + typecheck + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: whitecat01
          POSTGRES_DB: pctienda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:whitecat01@localhost:5432/pctienda_test
      JWT_SECRET: test-secret-2026-9f2c4a1b7e3d8c
      JWT_REFRESH_SECRET: test-refresh-secret-2026-5d8e2f1a9c4b7e
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pctienda/backend/package-lock.json

      - name: Install dependencies
        working-directory: pctienda/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: pctienda/backend
        run: npx prisma generate

      - name: Lint
        working-directory: pctienda/backend
        run: npm run lint

      - name: Typecheck
        working-directory: pctienda/backend
        run: npm run typecheck

      - name: Test
        working-directory: pctienda/backend
        run: npm test

  frontend:
    name: Frontend — lint + typecheck + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pctienda/frontend/package-lock.json

      - name: Install dependencies
        working-directory: pctienda/frontend
        run: npm ci

      - name: Lint
        working-directory: pctienda/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: pctienda/frontend
        run: npm run typecheck

      - name: Build
        working-directory: pctienda/frontend
        run: npm run build
